name: nice_store
description: "NICE Streetwear - e-commerce de moda asiática (Android, iOS e Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Textos do Material (calendário, relógio...) em português
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend (Auth + Postgres + Storage) - Android, iOS e Web
  supabase_flutter: ^2.8.4

  # Estado e navegação
  provider: ^6.1.2
  go_router: ^14.8.1

  # Dados de fallback (FakeStoreAPI)
  http: ^1.2.2

  # UI
  google_fonts: ^6.2.1

  # Upload de imagens de produtos (admin) - Android, iOS e Web
  image_picker: ^1.1.2

  # Ícones de redes sociais (Instagram, TikTok...) - Android, iOS e Web
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Logos e banners prontos. Lista explícita: as imagens "*_inspiracao_*" e
  # "*_nao_usar_*" são só referência de design e NÃO entram no app.
  assets:
    - assets/NiceB.PSD.png
    - assets/NiceP.PSD.png
    - assets/fundo_tela_login_e_cadastro.png
    - assets/web_carrosel_topo_home1_colocar_hyperlink.png
    - assets/web_carrosel_topo_home2_colocar_hyperlink.png
    - assets/sobre_nos_embaixo_carrosel_do_topo_home_colocar_hyperlink.png
    - assets/web_topo_categorias_colocar_hyperlink.png
    - assets/web_acima_do_footer_categorias_colocar_hyperlink.png
    - assets/web_topo_novidades_colocar_hyperlink.png
    - assets/web_novidades_em_cima_footer_destaque_imagem.png
    - assets/web_topo_sobrenos.png
    - assets/web_embaixo_topo_sobrenos.png
    - assets/web_acima_footer_sobrenos.png
