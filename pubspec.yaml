name: nice_store
description: "NICE Streetwear - e-commerce de moda asiática (Android, iOS e Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend (Auth + Postgres + Storage) - Android, iOS e Web
  supabase_flutter: ^2.8.4

  # Estado e navegação
  provider: ^6.1.2
  go_router: ^14.8.1

  # Dados de fallback (FakeStoreAPI)
  http: ^1.2.2

  # UI
  google_fonts: ^6.2.1

  # Upload de imagens de produtos (admin) - Android, iOS e Web
  image_picker: ^1.1.2

  # Login com Apple (usado somente no iOS) + nonce
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Logos (NiceB.PSD.png / NiceP.PSD.png) ficam na raiz de assets/
  # Banners gerados ficam em assets/banners/
  assets:
    - assets/
    - assets/banners/
